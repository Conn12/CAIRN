<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <title>鹈鹕骑自行车</title>
  <desc>夜色里，一只戴围巾的鹈鹕骑着自行车经过石堆与山丘，车轮转动，围巾随风飘动。</desc>

  <defs>
    <linearGradient id="pb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d11"/>
      <stop offset="0.55" stop-color="#131821"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="pb-moon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b96a" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#e8b96a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e8b96a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pb-vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <style>
      .pb-wheel,
      .pb-scarf {
        transform-box: view-box;
      }
      .pb-wheel-left {
        transform-origin: 430px 470px;
        animation: pb-spin 2.2s linear infinite;
      }
      .pb-wheel-right {
        transform-origin: 640px 470px;
        animation: pb-spin 2.2s linear infinite;
      }
      .pb-scarf {
        transform-origin: 600px 292px;
        animation: pb-flutter 2.8s ease-in-out infinite;
      }
      .pb-road-line {
        animation: pb-road 1.4s linear infinite;
      }
      .pb-stars {
        animation: pb-twinkle 5s ease-in-out infinite;
      }
      .pb-moon-glow {
        animation: pb-moon 6s ease-in-out infinite;
      }
      .pb-birds {
        animation: pb-drift 7s ease-in-out infinite;
      }

      @keyframes pb-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pb-road {
        to { stroke-dashoffset: -34; }
      }
      @keyframes pb-twinkle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @keyframes pb-moon {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }
      @keyframes pb-drift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-12px); }
      }
      @keyframes pb-flutter {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-2.2deg); }
      }
    </style>
  </defs>

  <rect width="960" height="600" fill="url(#pb-sky)"/>

  <g class="pb-stars" fill="#e6e9ef">
    <circle cx="90" cy="86" r="1.4" opacity="0.5"/>
    <circle cx="170" cy="140" r="1" opacity="0.35"/>
    <circle cx="260" cy="72" r="1.6" opacity="0.55"/>
    <circle cx="340" cy="150" r="1" opacity="0.3"/>
    <circle cx="430" cy="96" r="1.3" opacity="0.45"/>
    <circle cx="520" cy="60" r="1" opacity="0.35"/>
    <circle cx="600" cy="120" r="1.5" opacity="0.4"/>
    <circle cx="820" cy="70" r="1.2" opacity="0.5"/>
    <circle cx="890" cy="150" r="1.6" opacity="0.4"/>
    <circle cx="860" cy="230" r="1" opacity="0.3"/>
    <circle cx="120" cy="230" r="1.2" opacity="0.35"/>
    <circle cx="210" cy="300" r="0.9" opacity="0.25"/>
  </g>

  <circle class="pb-moon-glow" cx="740" cy="160" r="155" fill="url(#pb-moon-glow)"/>
  <circle cx="740" cy="160" r="78" fill="#e8b96a" opacity="0.92"/>
  <g fill="#0b0d11" opacity="0.08">
    <circle cx="716" cy="138" r="13"/>
    <circle cx="760" cy="176" r="9"/>
    <circle cx="734" cy="192" r="6"/>
  </g>

  <g class="pb-birds" fill="none" stroke="#8b93a7" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M380 180 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M430 150 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <path d="M0 430 C150 392 270 414 390 432 C510 450 620 402 730 412 C830 420 900 442 960 432 L960 600 L0 600 Z" fill="#12161e"/>
  <path d="M0 474 C150 446 300 476 440 484 C580 492 700 454 960 474 L960 600 L0 600 Z" fill="#0e1117"/>
  <path d="M0 540 C180 502 340 532 520 522 C700 512 840 502 960 522 L960 600 L0 600 Z" fill="#151a23"/>

  <path class="pb-road-line" d="M-20 574 C160 542 360 560 540 550 C720 540 860 542 980 558" fill="none" stroke="#e8b96a" stroke-width="2" stroke-dasharray="18 16" opacity="0.22"/>

  <g fill="none" stroke="#8b93a7" stroke-width="3" stroke-linecap="round" opacity="0.25">
    <path d="M296 432 C326 426 352 429 378 434"/>
    <path d="M278 468 C314 460 344 464 372 469"/>
    <path d="M306 504 C338 497 364 500 390 504"/>
  </g>

  <ellipse cx="532" cy="532" rx="158" ry="11" fill="#000000" opacity="0.32"/>

  <g stroke="#e8b96a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="430" cy="470" r="52"/>
    <circle cx="640" cy="470" r="52"/>
    <g class="pb-wheel pb-wheel-left" stroke-width="2" opacity="0.55">
      <path d="M430 418 V522 M378 470 H482 M393 433 L467 507 M467 433 L393 507"/>
    </g>
    <g class="pb-wheel pb-wheel-right" stroke-width="2" opacity="0.55">
      <path d="M640 418 V522 M588 470 H692 M603 433 L677 507 M677 433 L603 507"/>
    </g>
    <path d="M430 470 L500 404 L520 470 Z"/>
    <path d="M430 470 L520 470"/>
    <path d="M500 404 L600 394 L520 470"/>
    <path d="M520 470 L600 394"/>
    <path d="M600 394 L640 470"/>
    <path d="M600 394 L600 382 L620 375 L632 381"/>
  </g>

  <g fill="#e8b96a">
    <circle cx="430" cy="470" r="6"/>
    <circle cx="640" cy="470" r="6"/>
    <circle cx="520" cy="470" r="8"/>
  </g>

  <g stroke="#e8b96a" stroke-width="5" stroke-linecap="round">
    <path d="M520 470 L540 480"/>
    <path d="M534 484 H548"/>
  </g>

  <path d="M486 402 L514 397" stroke="#e8b96a" stroke-width="8" stroke-linecap="round"/>

  <path d="M470 372 C445 366 428 376 418 392 C440 398 458 392 474 386 Z" fill="#cfd6e2"/>

  <path d="M468 398 C455 355 480 315 525 310 C570 305 600 340 600 378 C600 415 565 432 525 430 C495 429 476 416 468 398 Z" fill="#e6e9ef"/>

  <path d="M560 328 C578 300 598 280 618 272" fill="none" stroke="#e6e9ef" stroke-width="30" stroke-linecap="round"/>

  <circle cx="620" cy="268" r="24" fill="#e6e9ef"/>

  <path d="M638 256 L736 278 Q742 283 734 289 L638 297 Z" fill="#e8a45e"/>
  <path d="M638 291 C664 340 716 334 736 286 L638 297 Z" fill="#d98b45"/>
  <path d="M641 288 L730 284" stroke="#b87333" stroke-width="2" opacity="0.55"/>

  <circle cx="630" cy="260" r="3" fill="#0b0d11"/>

  <path d="M600 250 Q610 238 622 248" fill="none" stroke="#e6e9ef" stroke-width="7" stroke-linecap="round"/>

  <g class="pb-scarf">
    <path d="M594 292 C576 308 550 314 526 304 C538 322 570 324 596 310 Z" fill="#7dcfff" opacity="0.9"/>
    <path d="M526 304 C500 294 478 298 462 286 C470 306 498 318 528 318 Z" fill="#7dcfff" opacity="0.6"/>
  </g>

  <path d="M522 338 C552 332 582 352 602 384 C576 394 544 382 522 338 Z" fill="#d5dae4"/>
  <g fill="none" stroke="#b9c0d0" stroke-width="2" stroke-linecap="round">
    <path d="M540 352 C558 358 574 370 586 384"/>
    <path d="M530 366 C546 372 560 382 570 392"/>
  </g>

  <path d="M548 415 L540 468" fill="none" stroke="#e8a45e" stroke-width="7" stroke-linecap="round"/>
  <path d="M528 474 L538 470 L548 476" fill="none" stroke="#e8a45e" stroke-width="5" stroke-linecap="round"/>

  <g fill="#e8b96a">
    <ellipse cx="820" cy="520" rx="42" ry="14" opacity="0.75"/>
    <ellipse cx="820" cy="502" rx="33" ry="12" opacity="0.85"/>
    <ellipse cx="820" cy="487" rx="24" ry="10"/>
  </g>

  <rect width="960" height="600" fill="url(#pb-vignette)"/>
</svg>
